# docs/agents/symphony.toml in the target repo. Paths are relative to the repo root.

[tracker]
backend = "gitea"            # gitea (the `tea` CLI) or github (the `gh` CLI)
repo = "owner/name"
login = "agentbot"           # gitea: the tea login agents act as; passed on every call

[labels]
ready = "ready-for-agent"    # the queue
blocking = "blocking"        # waiting on the user's answer

[state]
dir = "~/.local/share/symphony/name"   # outside the repo: plan, ledger, briefs, specs, logs
# ledger = "ledger.tsv"
# asked_marker = "QUESTIONS ON TICKET"

[brief]
worktrees = ".claude/worktrees"        # implementer worktrees, <worktrees>/<prefix><n>
worktree_prefix = "orch-"
rules = "docs/agents/symphony-brief.md"        # build, test and repo rules spliced into every brief
# explore_notes = "docs/agents/symphony-explore.md"  # project notes for the explore prompt
code_dir = "src"                       # where the explore agent looks
